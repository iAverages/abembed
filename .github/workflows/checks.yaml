name: Lint
on:
  workflow_call:

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Mic92/niks3-action@v1
        continue-on-error: true
        with:
          server-url: https://niks3.kirsi.dev
          skip-push: ${{ github.ref != 'refs/heads/main' }}
      - run: nix flake check
