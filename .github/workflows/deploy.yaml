name: Deploy
on:
  push:
    branches: ["main", "staging"]
  workflow_dispatch:
    inputs:
      abembed:
        type: boolean
      provider:
        type: boolean
      proxy:
        type: boolean
      api:
        type: boolean
      embed-image-service:
        type: boolean
      gif-service:
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      abembed: ${{ inputs.abembed || steps.filter.outputs.abembed }}
      provider: ${{ inputs.provider || steps.filter.outputs.provider }}
      proxy: ${{ inputs.proxy || steps.filter.outputs.proxy }}
      api: ${{ inputs.api || steps.filter.outputs.api }}
      embed-image-service: ${{ inputs.embed-image-service || steps.filter.outputs.embed-image-service }}
      gif-service: ${{ inputs.gif-service || steps.filter.outputs.gif-service }}
    steps:
      - uses: actions/checkout@v7
      # a failed or cancelled run deployed nothing, so its changes count towards the next one
      - name: Find the last successful deploy
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh run list --workflow deploy.yaml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.last.outputs.sha }}
          filters: |
            workspace: &workspace
              - Cargo.toml
              - Cargo.lock
            nix: &nix
              - flake.nix
              - flake.lock
            abembed:
              - *workspace
              - *nix
              - apps/abembed/**
              - packages/common/**
            provider:
              - *workspace
              - *nix
              - apps/provider/**
            proxy:
              - *workspace
              - *nix
              - apps/proxy/**
            api:
              - *workspace
              - *nix
              - apps/api/**
              - packages/common/**
            embed-image-service:
              - *nix
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - apps/embed-image-service/**
              - packages/embed-image/**
              - packages/config/**
            gif-service:
              - *workspace
              - *nix
              - apps/gif-service/**

  provider:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.provider == 'true'
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: provider
      wrangler_envs: a b c d
      environment: production
    secrets: inherit

  abembed:
    needs: [checks, changes, provider]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.abembed == 'true' && needs.provider.result != 'failure' }}
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: abembed
      wrangler_envs: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      d1_binding: ACCOUNTS
    secrets: inherit

  proxy:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.proxy == 'true'
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: proxy
      wrangler_envs: production
      environment: production
    secrets: inherit

  api:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/base-publish.yaml
    with:
      environment: production
      nix_image_attr: apiDockerImage
      deployment_name: abembed/api
      argo_deployments_path: "helm/spqtify.com/values/production.yaml"
      version_key: apiVersion
    secrets: inherit

  embed-image-service:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.embed-image-service == 'true'
    uses: ./.github/workflows/base-publish.yaml
    with:
      environment: production
      nix_image_attr: embedImageServiceDockerImage
      deployment_name: abembed/embed-image-service
      argo_deployments_path: "helm/spqtify.com/values/production.yaml"
      version_key: embedImageServiceVersion
    secrets: inherit

  gif-service:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.gif-service == 'true'
    uses: ./.github/workflows/base-publish.yaml
    with:
      environment: production
      nix_image_attr: gifServiceDockerImage
      deployment_name: abembed/gif-service
      argo_deployments_path: "helm/spqtify.com/values/production.yaml"
      version_key: gifServiceVersion
    secrets: inherit

  manifests:
    needs: [checks, api, embed-image-service, gif-service]
    if: ${{ !cancelled() && github.ref_name == 'main' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Publish manifests to the deploy branch
        env:
          API: ${{ needs.api.result }}
          EMBED_IMAGE_SERVICE: ${{ needs.embed-image-service.result }}
          GIF_SERVICE: ${{ needs.gif-service.result }}
        run: |
          set -euo pipefail

          tag="production-$GITHUB_SHA"
          images=()
          [ "$API" != success ] || images+=("ghcr.io/iaverages/abembed/api:$tag")
          [ "$EMBED_IMAGE_SERVICE" != success ] || images+=("ghcr.io/iaverages/abembed/embed-image-service:$tag")
          [ "$GIF_SERVICE" != success ] || images+=("ghcr.io/iaverages/abembed/gif-service:$tag")

          manifests="$(nix build .#manifests --no-link --print-out-paths)"
          kustomize="$(nix build --inputs-from . nixpkgs#kustomize --no-link --print-out-paths)/bin/kustomize"

          git fetch --depth=1 origin deploy
          git worktree add "$RUNNER_TEMP/deploy" FETCH_HEAD
          cd "$RUNNER_TEMP/deploy"
          rsync --recursive --delete --chmod=D755,F644 "$manifests/" base/
          [ "${#images[@]}" -eq 0 ] || "$kustomize" edit set image "${images[@]}"

          git add --all
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "deploy $GITHUB_SHA"
          git push origin HEAD:deploy
