name: Deploy
on:
  push:
    branches: ["main", "staging"]

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  changes:
    runs-on: ubuntu-latest
    outputs:
      abembed: ${{ steps.filter.outputs.abembed }}
      provider: ${{ steps.filter.outputs.provider }}
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - Cargo.toml
              - Cargo.lock
            abembed:
              - *workspace
              - apps/abembed/**
            provider:
              - *workspace
              - apps/provider/**
            proxy:
              - *workspace
              - apps/proxy/**

  provider:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.provider == 'true'
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: provider
      wrangler_envs: a b c d
      environment: production
    secrets: inherit

  abembed:
    needs: [checks, changes, provider]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.abembed == 'true' && needs.provider.result != 'failure' }}
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: abembed
      wrangler_envs: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      d1_binding: ACCOUNTS
    secrets: inherit

  proxy:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.proxy == 'true'
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: proxy
      wrangler_envs: production
      environment: production
    secrets: inherit

  # todo: only build and publish if had changes
  containers:
    needs: checks
    if: github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            deployment_name: spqtify.com/api
            nix_image_attr: apiDockerImage
            version_key: apiVersion
          - app: embed-image-service
            deployment_name: spqtify.com/embed-image-service
            nix_image_attr: embedImageServiceDockerImage
            version_key: embedImageServiceVersion
          - app: gif-service
            deployment_name: abembed/gif-service
            nix_image_attr: gifServiceDockerImage
            version_key: gifServiceVersion
    uses: ./.github/workflows/base-publish.yaml
    with:
      environment: production
      nix_image_attr: ${{ matrix.nix_image_attr }}
      deployment_name: ${{ matrix.deployment_name }}
      argo_deployments_path: "helm/spqtify.com/values/production.yaml"
      version_key: ${{ matrix.version_key }}
    secrets: inherit
