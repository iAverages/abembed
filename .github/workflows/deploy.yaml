name: Deploy
on:
  push:
    branches: ["main", "staging"]

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  changes:
    runs-on: ubuntu-latest
    outputs:
      abembed: ${{ steps.filter.outputs.abembed }}
      provider: ${{ steps.filter.outputs.provider }}
      proxy: ${{ steps.filter.outputs.proxy }}
      api: ${{ steps.filter.outputs.api }}
      embed-image-service: ${{ steps.filter.outputs.embed-image-service }}
      gif-service: ${{ steps.filter.outputs.gif-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - Cargo.toml
              - Cargo.lock
            nix: &nix
              - flake.nix
              - flake.lock
            abembed:
              - *workspace
              - *nix
              - apps/abembed/**
            provider:
              - *workspace
              - *nix
              - apps/provider/**
            proxy:
              - *workspace
              - *nix
              - apps/proxy/**
            api:
              - *workspace
              - *nix
              - apps/api/**
            embed-image-service:
              - *nix
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - apps/embed-image-service/**
              - packages/embed-image/**
              - packages/config/**
            gif-service:
              - *workspace
              - *nix
              - apps/gif-service/**

  provider:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.provider == 'true'
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: provider
      wrangler_envs: a b c d
      environment: production
    secrets: inherit

  abembed:
    needs: [checks, changes, provider]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.abembed == 'true' && needs.provider.result != 'failure' }}
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: abembed
      wrangler_envs: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      d1_binding: ACCOUNTS
    secrets: inherit

  proxy:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.proxy == 'true'
    uses: ./.github/workflows/base-deploy-worker.yaml
    with:
      app: proxy
      wrangler_envs: production
      environment: production
    secrets: inherit

  api:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/base-publish.yaml
    with:
      environment: production
      nix_image_attr: apiDockerImage
      deployment_name: spqtify.com/api
      argo_deployments_path: "helm/spqtify.com/values/production.yaml"
      version_key: apiVersion
    secrets: inherit

  embed-image-service:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.embed-image-service == 'true'
    uses: ./.github/workflows/base-publish.yaml
    with:
      environment: production
      nix_image_attr: embedImageServiceDockerImage
      deployment_name: spqtify.com/embed-image-service
      argo_deployments_path: "helm/spqtify.com/values/production.yaml"
      version_key: embedImageServiceVersion
    secrets: inherit

  gif-service:
    needs: [checks, changes]
    if: github.ref_name == 'main' && needs.changes.outputs.gif-service == 'true'
    uses: ./.github/workflows/base-publish.yaml
    with:
      environment: production
      nix_image_attr: gifServiceDockerImage
      deployment_name: abembed/gif-service
      argo_deployments_path: "helm/spqtify.com/values/production.yaml"
      version_key: gifServiceVersion
    secrets: inherit
