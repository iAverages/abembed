name: Build and Push
on:
  workflow_call:
    inputs:
      nix_image_attr:
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      argo_deployments_path:
        required: true
        type: string
      version_key:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      DEPLOYMENTS_REPO_TOKEN:
        required: true
jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, load, and push image
        shell: bash
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/${{ env.DEPLOYMENT_NAME }}:${{
            inputs.environment }}-${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_TAG="$(printf '%s' "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')"

          image_path="$(nix build ".#${{ inputs.nix_image_attr }}" --print-out-paths)"
          load_output="$(docker load -i "$image_path")"
          source_image="$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image: //p' | head -n1)"

          if [ -z "$source_image" ]; then
            source_image="$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image ID: //p' | head -n1)"
          fi

          if [ -z "$source_image" ]; then
            printf 'Unable to determine source image from docker load output:\n%s\n' "$load_output" >&2
            exit 1
          fi

          docker tag "$source_image" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
