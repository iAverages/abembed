[[bin]]
name = "hosted-provider"
path = "src/main.rs"

[package]
name = "hosted-provider"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.1"
bytes = "1.10.1"
reqwest = { version = "0.12.14", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.6.2", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
