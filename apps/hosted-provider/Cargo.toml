[[bin]]
name = "hosted-provider"
path = "src/main.rs"

[package]
name = "hosted-provider"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.1"
bytes = "1.10.1"
http-body-util = "0.1.2"
hyper-openssl = { version = "0.10.3", features = ["client-legacy"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
openssl = "0.10.71"
openssl-sys = "0.9.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"

[dev-dependencies]
reqwest = { version = "0.13.0", default-features = false }
