name = "abembed-proxy"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

[vars]
ALLOWED_HOSTS = "tiktokcdn.com,tiktokcdn-us.com,tiktokv.com,tiktokcdn-eu.com,fbcdn.net"

# routes live here rather than top level so `wrangler dev` keeps the real request host
[env.production]
name = "abembed-proxy"
routes = [{ pattern = "proxy.abembed.com", custom_domain = true }]

[env.production.vars]
ALLOWED_HOSTS = "tiktokcdn.com,tiktokcdn-us.com,tiktokv.com,tiktokcdn-eu.com,fbcdn.net"
