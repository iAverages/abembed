[[bin]]
name = "gif-service"
path = "src/main.rs"

[package]
name = "gif-service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.1"
bytes = "1.10.1"
futures = "0.3.31"
reqwest = { version = "0.13.0", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
