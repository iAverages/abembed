[package]
name = "abembed"
version = "0.1.0"
edition = "2021"
authors = ["iAverages <me@danielraybone.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum', 'd1'] }
worker-macros = { version = "0.8", features = ['http'] }
axum = { version = "0.8", default-features = false }
tower-service = "0.3.3"
tower-http = { version = "0.6.2", features = ["normalize-path"] }
regex = "1.13.1"
scraper = "0.27.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
roxmltree = "0.21"
aes-gcm = "0.10"
subtle = "2"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
