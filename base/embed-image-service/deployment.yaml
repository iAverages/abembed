apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: embed-image-service
  name: embed-image-service
  namespace: abembed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: embed-image-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embed-image-service
    spec:
      containers:
      - image: ghcr.io/iaverages/abembed/embed-image-service
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
        name: embed-image-service
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
