apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: gif-service
  name: gif-service
  namespace: abembed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gif-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gif-service
    spec:
      containers:
      - image: ghcr.io/iaverages/abembed/gif-service
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 2
        name: gif-service
        ports:
        - containerPort: 3002
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '4'
            memory: 4Gi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
