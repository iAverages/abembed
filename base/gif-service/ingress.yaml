apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/name: gif-service
  name: gif-service
  namespace: abembed
spec:
  ingressClassName: traefik
  rules:
  - host: gif.abembed.com
    http:
      paths:
      - backend:
          service:
            name: gif-service
            port:
              number: 3002
        path: /
        pathType: Prefix
